[project]
name = "burrow-pockets"
version = "1.0.0"
description = "BURROW: fast protein ligand-binding pocket detection and ranking (CPU/GPU, AlphaFold mode, multimers). Developed by AI agents; see README."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Versions pinned to the environment in which the models were trained and all results were produced
# (Python 3.12.3). Other versions will probably work but are untested.
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pandas==3.1.0",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "gemmi==0.7.5",
    "lightgbm==4.7.0",
]

[project.optional-dependencies]
# GPU backend (Triton/PyTorch kernels; tested with CUDA 12.4 wheels on RTX 4090)
gpu = ["torch==2.6.0", "triton==3.2.0"]
# benchmark/training-set construction (scripts/data) and the PocketWatch importer
data = ["pyarrow==26.0.0", "biotite==2.0.0", "requests==2.34.2"]
test = ["pytest==9.1.1"]

[project.scripts]
burrow = "pocketdetect.burrow.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# non-.py runtime files (fast-backend validation hashes)
pocketdetect = ["burrow/fast/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not gpu'"
markers = [
    "slow: long-running test (reference vs fast backend on all examples and options); run with -m slow",
    "gpu: needs a CUDA GPU (skipped automatically if none); run with -m gpu",
]
